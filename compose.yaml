services:
  api:
    build: .
    container_name: payment-api

    ports:
      - "5000:5000"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    container_name: payment-db

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: payment-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: