services:
  server:
    build: .
    ports:
      - "${APP_PORT}:5000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
  celery:
    build: .
    command: python -m celery -A celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data    
      
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
volumes:
  postgres_data: