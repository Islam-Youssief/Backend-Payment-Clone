tags:
  - name: Payment Providers
    description: Endpoints for all integrated payment providers (Fawry, PayPal, etc.)

paths:
  api/payments/fawry:
    post:
      tags:
        - Payment Providers
      summary: Process payment via Fawry using Card
      description: Initiates a server-to-server card payment through Fawry API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FawryPaymentRequest'
      responses:
        201:
          description: Successful payment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FawryPaymentResponse'
        400:
          description: Validation error or missing fields

components:
  schemas:
    FawryPaymentRequest:
      type: object
      required:
        - amount
        - cardNumber
        - cardHolder
        - cvv
      properties:
        merchantRefNum:
          type: string
          description: Unique order identifier
        customerProfileId:
          type: string
          description: Optional customer ID
        amount:
          type: number
          format: float
          description: Order total amount (must be > 0)
        cardHolder:
          type: string
          description: Card holder name
        cardNumber:
          type: string
          description: 16-digit credit card number
        cardExpiryYear:
          type: string
          description: 2-digit expiry year (> 20)
        cardExpiryMonth:
          type: string
          description: 2-digit expiry month (01-12)
        cvv:
          type: string
          description: 3-digit CVV code
      example:
        merchantRefNum: "ORDER_123456"
        customerProfileId: "CUST_987"
        amount: 100.50
        cardHolder: "Mohamed Riyad"
        cardNumber: "4111111111111111"
        cardExpiryYear: "25"
        cardExpiryMonth: "12"
        cvv: "123"

    FawryPaymentResponse:
      type: object
      properties:
        url:
          type: string
        reference_number:
          type: string
        merchant_ref_number:
          type: string
        order_amount:
          type: number
        payment_amount:
          type: number
        fawry_fees:
          type: number
        payment_method:
          type: string
        order_status:
          type: string
        payment_time:
          type: integer
        customer_mobile:
          type: string
        customer_mail:
          type: string
        customer_profile_id:
          type: string
        signature:
          type: string
        status_code:
          type: integer
        status_description:
          type: string
      example:
        url: "/api/payments/fawry"
        reference_number: "931317134"
        merchant_ref_number: "ORDER_123456"
        order_amount: 100.50
        payment_amount: 100.50
        fawry_fees: 0.00
        payment_method: "CARD"
        order_status: "PAID"
        payment_time: 1640995200000
        customer_mobile: "01012345678"
        customer_mail: "test@example.com"
        customer_profile_id: "CUST_987"
        signature: "generated_hash_string"
        status_code: 200
        status_description: "Operation done successfully"
